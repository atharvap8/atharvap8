<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    :root {
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --glow-1: #6366f1;
      --glow-2: #06b6d4;
      --orb-opacity: 0.15;
      --ring-color: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --glow-1: #818cf8;
        --glow-2: #22d3ee;
        --orb-opacity: 0.35;
        --ring-color: #334155;
      }
    }

    /* Soft breathing background glows */
    .glow-orb-1 {
      fill: var(--glow-1);
      filter: url(#blur-large);
      animation: breathe1 8s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      fill: var(--glow-2);
      filter: url(#blur-large);
      animation: breathe2 8s ease-in-out infinite alternate-reverse;
    }

    @keyframes breathe1 {
      0% { opacity: calc(var(--orb-opacity) * 0.7); transform: translate(0px, 0px) scale(1); }
      100% { opacity: calc(var(--orb-opacity) * 1.3); transform: translate(30px, -20px) scale(1.1); }
    }
    @keyframes breathe2 {
      0% { opacity: calc(var(--orb-opacity) * 0.6); transform: translate(0px, 0px) scale(0.9); }
      100% { opacity: calc(var(--orb-opacity) * 1.2); transform: translate(-40px, 30px) scale(1.1); }
    }

    /* Abstract orbiting rings */
    .orbital-ring {
      fill: none;
      stroke: var(--glow-1);
      stroke-width: 1.5;
      opacity: 0.3;
      transform-origin: 180px 150px;
    }
    .orbital-ring-2 {
      stroke: var(--glow-2);
      transform-origin: 180px 150px;
      animation: spin 20s linear infinite;
    }
    .orbital-ring-3 {
      stroke: var(--glow-1);
      transform-origin: 180px 150px;
      animation: spin 30s linear infinite reverse;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Orbiting particles */
    .orbiting-dot {
      fill: var(--glow-2);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { r: 3px; opacity: 0.6; filter: drop-shadow(0 0 2px var(--glow-2)); }
      50% { r: 5px; opacity: 1; filter: drop-shadow(0 0 8px var(--glow-2)); }
    }

    /* Premium Text Styling */
    .title-name {
      font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#textGrad);
      letter-spacing: 5px;
    }
    .title-sub {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-weight: 500;
      font-size: 13px;
      fill: var(--text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Tech accents but aesthetic */
    .line-accent {
      stroke: url(#lineGrad);
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>

  <defs>
    <!-- Large beautiful blur for back glows -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--glow-1)" />
      <stop offset="60%" stop-color="var(--glow-2)" />
      <stop offset="100%" stop-color="var(--glow-1)" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--glow-1)" stop-opacity="1" />
      <stop offset="100%" stop-color="var(--glow-2)" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Transparent boundary -->
  <rect width="800" height="300" fill="none" />

  <!-- Ambient Glows (Behind everything) -->
  <g transform="translate(0, 0)">
    <circle cx="200" cy="120" r="130" class="glow-orb-1" />
    <circle cx="550" cy="180" r="145" class="glow-orb-2" />
  </g>

  <!-- Abstract Aesthetic Orbital Structure on Left -->
  <g transform="translate(0, 0)">
    <!-- Deep background decorative rings -->
    <circle cx="180" cy="150" r="85" class="orbital-ring" stroke-dasharray="8 6" />
    <circle cx="180" cy="150" r="60" class="orbital-ring orbital-ring-2" stroke-dasharray="140 100" />
    <circle cx="180" cy="150" r="35" class="orbital-ring orbital-ring-3" stroke-dasharray="20 15" />
    
    <!-- Central aesthetic core -->
    <circle cx="180" cy="150" r="12" fill="none" stroke="var(--glow-2)" stroke-width="2" opacity="0.4" />
    <circle cx="180" cy="150" r="4" class="orbiting-dot" />
  </g>

  <!-- Sleek Aesthetic Typography in Center-Right -->
  <g transform="translate(340, 130)">
    <!-- Title Name: ATHARVA PHADKE -->
    <text x="0" y="10" class="title-name">ATHARVA PHADKE</text>
    
    <!-- Thin elegant horizontal accent line -->
    <line x1="2" y1="28" x2="380" y2="28" class="line-accent" />
    
    <!-- Subtitle: EMBEDDED & IOT ENGINEER -->
    <text x="3" y="52" class="title-sub">Embedded &amp; IoT Engineer</text>
  </g>

  <!-- Floating background particles for high-end look -->
  <g opacity="0.5">
    <circle cx="700" cy="80" r="1.5" fill="var(--glow-2)" opacity="0.6"/>
    <circle cx="730" cy="140" r="2.5" fill="var(--glow-1)" opacity="0.4"/>
    <circle cx="680" cy="220" r="1" fill="var(--glow-2)" opacity="0.7"/>
    <circle cx="110" cy="70" r="2" fill="var(--glow-1)" opacity="0.5"/>
    <circle cx="90" cy="210" r="1.5" fill="var(--glow-2)" opacity="0.6"/>
  </g>
</svg>
