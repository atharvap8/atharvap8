<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <style>
    :root {
      --bg-glow: rgba(99, 102, 241, 0.05);
      --text-main: #0f172a;
      --text-sub: #475569;
      --circuit-base: #e2e8f0;
      --circuit-trace-1: #3b82f6;
      --circuit-trace-2: #8b5cf6;
      --mcu-body: #1e293b;
      --mcu-pin: #64748b;
      --led-glow: #ef4444;
      --glow-intensity: 0.12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-glow: rgba(6, 182, 212, 0.1);
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --circuit-base: #1e293b;
        --circuit-trace-1: #06b6d4;
        --circuit-trace-2: #818cf8;
        --mcu-body: #0f172a;
        --mcu-pin: #cbd5e1;
        --led-glow: #10b981;
        --glow-intensity: 0.25;
      }
    }

    /* Pulse trace animations */
    .trace-p1 {
      stroke: var(--circuit-trace-1);
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: pulseTrace1 6s linear infinite;
    }
    .trace-p2 {
      stroke: var(--circuit-trace-2);
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: pulseTrace2 6s linear infinite;
    }
    .trace-base {
      stroke: var(--circuit-base);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.4;
    }
    
    @keyframes pulseTrace1 {
      0% {
        stroke-dashoffset: 400;
      }
      100% {
        stroke-dashoffset: -400;
      }
    }

    @keyframes pulseTrace2 {
      0% {
        stroke-dashoffset: 300;
      }
      100% {
        stroke-dashoffset: -300;
      }
    }

    /* Pulse LED animation */
    .led-breathing {
      fill: var(--led-glow);
      animation: breathe 2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Custom Typography styling */
    .title-text {
      font-family: 'Orbitron', 'Outfit', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: var(--text-main);
      letter-spacing: 3px;
    }
    .subtitle-text {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: 13px;
      fill: var(--circuit-trace-1);
      letter-spacing: 1.5px;
    }
    .desc-text {
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      fill: var(--text-sub);
    }
  </style>

  <!-- Glowing background behind name -->
  <rect width="800" height="300" fill="none" />
  <circle cx="400" cy="150" r="220" fill="url(#radialGlow)" opacity="0.8"/>

  <defs>
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--circuit-trace-1)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="var(--circuit-trace-1)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- MCU chip visualization on left -->
  <g transform="translate(60, 80)">
    <!-- MCU body -->
    <rect x="20" y="20" width="80" height="80" rx="8" fill="var(--mcu-body)" stroke="var(--circuit-base)" stroke-width="2" />
    
    <!-- MCU Pins (Left) -->
    <line x1="10" y1="35" x2="20" y2="35" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="10" y1="50" x2="20" y2="50" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="10" y1="65" x2="20" y2="65" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="10" y1="80" x2="20" y2="80" stroke="var(--mcu-pin)" stroke-width="2"/>

    <!-- MCU Pins (Right) -->
    <line x1="100" y1="35" x2="110" y2="35" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="100" y1="50" x2="110" y2="50" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="100" y1="65" x2="110" y2="65" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="100" y1="80" x2="110" y2="80" stroke="var(--mcu-pin)" stroke-width="2"/>

    <!-- MCU Pins (Top) -->
    <line x1="35" y1="10" x2="35" y2="20" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="50" y1="10" x2="50" y2="20" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="65" y1="10" x2="65" y2="20" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="80" y1="10" x2="80" y2="20" stroke="var(--mcu-pin)" stroke-width="2"/>

    <!-- MCU Pins (Bottom) -->
    <line x1="35" y1="100" x2="35" y2="110" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="50" y1="100" x2="50" y2="110" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="65" y1="100" x2="65" y2="110" stroke="var(--mcu-pin)" stroke-width="2"/>
    <line x1="80" y1="100" x2="80" y2="110" stroke="var(--mcu-pin)" stroke-width="2"/>

    <!-- MCU text -->
    <text x="60" y="55" font-family="'Space Mono', monospace" font-size="10" fill="var(--text-sub)" text-anchor="middle" font-weight="bold">STM32G4</text>
    <text x="60" y="70" font-family="'Space Mono', monospace" font-size="8" fill="var(--circuit-trace-1)" text-anchor="middle">FOC READY</text>
    
    <!-- Pulsing Power LED -->
    <circle cx="90" cy="30" r="3" class="led-breathing" />
  </g>

  <!-- Circuit Traces branching out from MCU to center/right -->
  <!-- Trace 1 (Indigo pulsing) -->
  <path d="M 170 130 L 260 130 L 290 160 L 400 160" class="trace-base"/>
  <path d="M 170 130 L 260 130 L 290 160 L 400 160" class="trace-base trace-p1" stroke-width="2"/>

  <!-- Trace 2 (Cyan pulsing) -->
  <path d="M 170 115 L 230 115 L 270 75 L 350 75 L 380 105" class="trace-base"/>
  <path d="M 170 115 L 230 115 L 270 75 L 350 75 L 380 105" class="trace-base trace-p2" stroke-width="2"/>

  <!-- Trace 3 (Static thin) -->
  <path d="M 155 90 L 195 50 L 320 50" class="trace-base"/>
  <circle cx="320" cy="50" r="3" fill="var(--circuit-base)"/>

  <path d="M 155 160 L 210 215 L 310 215" class="trace-base"/>
  <circle cx="310" cy="215" r="3" fill="var(--circuit-base)"/>

  <!-- Main text grouping in center-right -->
  <g transform="translate(320, 110)">
    <!-- Title: Atharva Phadke -->
    <text x="0" y="20" class="title-text">ATHARVA PHADKE</text>
    
    <!-- Subtitle: IoT & Embedded Systems Engineer -->
    <text x="3" y="45" class="subtitle-text">EMBEDDED &amp; IOT ENGINEER</text>

    <!-- Short tech stack text block -->
    <text x="3" y="70" class="desc-text">⚡ STM32 · ESP32 · KiCAD PCB Design · FreeRTOS</text>
    <text x="3" y="88" class="desc-text">🔬 Custom Motor Control · Robot R&amp;D for ABU-ROBOCON 2026</text>
  </g>

  <!-- Interactive looking test points on right edge -->
  <g transform="translate(705, 60)" opacity="0.8">
    <circle cx="20" cy="20" r="4" fill="var(--circuit-trace-1)" opacity="0.6"/>
    <circle cx="20" cy="20" r="2" fill="var(--circuit-trace-1)"/>
    <line x1="24" y1="20" x2="50" y2="20" stroke="var(--circuit-base)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="55" y="24" font-family="Space Mono, monospace" font-size="9" fill="var(--text-sub)">TP_3V3</text>

    <circle cx="20" cy="50" r="4" fill="var(--circuit-trace-2)" opacity="0.6"/>
    <circle cx="20" cy="50" r="2" fill="var(--circuit-trace-2)"/>
    <line x1="24" y1="50" x2="50" y2="50" stroke="var(--circuit-base)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="55" y="54" font-family="Space Mono, monospace" font-size="9" fill="var(--text-sub)">TP_CAN_H</text>

    <circle cx="20" cy="80" r="4" fill="var(--circuit-trace-1)" opacity="0.6"/>
    <circle cx="20" cy="80" r="2" fill="var(--circuit-trace-1)"/>
    <line x1="24" y1="80" x2="50" y2="80" stroke="var(--circuit-base)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="55" y="84" font-family="Space Mono, monospace" font-size="9" fill="var(--text-sub)">TP_CAN_L</text>
  </g>

  <!-- Bottom boundary line representing a PCB board cut -->
  <line x1="50" y1="260" x2="750" y2="260" stroke="var(--circuit-base)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="260" r="3" fill="var(--circuit-base)"/>
  <circle cx="750" cy="260" r="3" fill="var(--circuit-base)"/>
  <text x="400" y="280" font-family="Space Mono, monospace" font-size="9" fill="var(--text-sub)" text-anchor="middle" letter-spacing="1">LAYER_01_TOP_COPPER // R&amp;D_LAB_ACTIVE</text>
</svg>
